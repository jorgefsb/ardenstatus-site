/* Arden identity, taken from the logo and Arden's decks: night-sky indigo, the green maze glyph, violet glow.
   Data colors validated for color-blind separation (dataviz validator): Amber gold vs external violet. */
:root{
  --night:#120C33; --night-2:#1C1548; --night-line:#342B6E; --night-ink:#F3F1FB; --night-ink-2:#BDB6DE; --night-muted:#8D86B3;
  --green:#93C11F; --green-ink:#120C33; --violet-glow:#4A1675;
  --bg:#F6F5FA; --surface:#FFFFFF; --ink:#17122E; --ink-2:#4B4566; --muted:#77728E; --line:#E2DFEC; --line-soft:#EEECF4;
  --amber:#C08A00; --ext:#6A3FB5; --cost:#2E2858;
  --link:#2D2275; --btn:#17122E; --btn-ink:#FFFFFF;
  --good:#3B7414; --attn:#B4432C; --pending:#5D5880;
  --good-bg:#EAF3DC; --attn-bg:#F8E7E2; --pending-bg:#ECEAF4;

}

/* ---------- lock screen ---------- */
.gate{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:40px 20px;color:var(--night-ink);position:relative;overflow:hidden}
.langbar{position:absolute;top:16px;right:16px;z-index:3}
.langseg button{min-width:38px}
.gate-in{width:100%;max-width:420px;display:grid;gap:22px;justify-items:center;text-align:center;position:relative}
.gate-mark{width:150px;display:grid;gap:14px;justify-items:center}
.gate-mark .glyph{width:128px;height:auto;overflow:visible}
.gate-mark .word{width:132px;height:auto;fill:var(--night-ink)}
.glyph path{fill:var(--green);stroke:var(--green);stroke-width:1.2;stroke-linejoin:round}
.gate h1{font-size:clamp(30px,6vw,40px);line-height:1.05;color:#fff;font-weight:800}
.gate .lede{color:var(--night-ink-2);font-size:15px;max-width:36ch}
.gate form{width:100%;display:grid;gap:12px;text-align:left;margin-top:4px}
.gate label{font-size:13px;color:var(--night-ink-2);font-weight:500}
.pwbox{display:flex;align-items:stretch;background:var(--night-2);border:1px solid var(--night-line);border-radius:12px;transition:border-color .15s,box-shadow .15s}
.pwbox:focus-within{border-color:var(--green);box-shadow:0 0 0 3px rgba(147,193,31,.22)}
.pwbox.bad{border-color:#F2907A}
.pwbox input{flex:1;min-width:0;font:inherit;font-size:17px;letter-spacing:.02em;padding:14px 14px;background:transparent;border:0;color:#fff;outline:none}
.pwbox input::placeholder{color:var(--night-muted)}
.eye{border:0;background:transparent;color:var(--night-ink-2);padding:0 14px;cursor:pointer;display:grid;place-items:center;border-radius:0 12px 12px 0}
.eye svg{width:20px;height:20px}
.eye:hover{color:#fff}
.gobtn{font:inherit;font-size:16px;font-weight:600;border:0;border-radius:12px;padding:14px 18px;background:var(--green);color:var(--green-ink);cursor:pointer;transition:filter .15s}
.gobtn:hover{filter:brightness(1.07)}
.gobtn:disabled{cursor:progress;filter:saturate(.6)}
.gatemsg{min-height:1.4em;font-size:14px;color:var(--night-ink-2)}
.gatemsg.err{color:#F6A491}
.caps{font-size:13px;color:#F0CF62}
.gate .meta{font-size:12.5px;color:var(--night-muted);max-width:40ch;line-height:1.5}
/* glyph states: draw on load, trace while checking, light up on success */
@media (prefers-reduced-motion:no-preference){
  .glyph.draw path{stroke-dasharray:1;stroke-dashoffset:1;fill-opacity:0;animation:draw 1.5s cubic-bezier(.6,0,.3,1) .15s forwards,fillin .6s ease 1.35s forwards}
  .glyph.tracing path{fill-opacity:.12;stroke-dasharray:.18 .82;animation:trace 1.1s linear infinite}
  .glyph.opened{animation:lift .5s ease forwards}
  .gate.leaving{animation:fadeout .45s ease .25s forwards}
  .dash-enter{animation:fadein .5s ease both}
}
.glyph.opened path{fill:#B6E36A;stroke:#B6E36A;fill-opacity:1;filter:drop-shadow(0 0 14px rgba(182,227,106,.55))}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fillin{to{fill-opacity:1}}
@keyframes trace{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes lift{to{transform:scale(1.06)}}
@keyframes fadeout{to{opacity:0}}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* ---------- dashboard band ---------- */
.band{color:var(--night-ink);position:relative;overflow:hidden;padding-bottom:30px}
.band .bigglyph{position:absolute;right:-90px;top:-30px;width:470px;height:auto;fill:none;stroke:rgba(147,193,31,.16);stroke-width:.6;pointer-events:none}
.band-top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:18px;flex-wrap:wrap;position:relative}
.brand{display:flex;align-items:center;gap:12px;color:var(--night-ink);text-decoration:none}
.brand .g{width:30px;height:auto;fill:var(--green)}
.brand .w{width:96px;height:auto;fill:var(--night-ink)}
.brand span{font-size:13px;color:var(--night-muted);padding-left:12px;border-left:1px solid var(--night-line);line-height:1.2}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--night-line);border-radius:10px;overflow:hidden}
.seg button{font:inherit;font-size:13px;font-weight:600;padding:7px 12px;border:0;background:transparent;color:var(--night-ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--night-ink);color:var(--night)}
.ibtn{font:inherit;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--night-line);background:transparent;color:var(--night-ink-2);border-radius:10px;padding:7px 11px;cursor:pointer;text-decoration:none}
.ibtn:hover{color:#fff;border-color:var(--night-muted)}
.ibtn svg{width:16px;height:16px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-top:26px;position:relative}
.hero h1{font-size:clamp(34px,6vw,62px);line-height:1;color:#fff;letter-spacing:-.025em;font-weight:800}
.hero .sub{color:var(--night-ink-2);margin-top:14px;max-width:58ch}
.drive{display:inline-flex;align-items:center;gap:10px;background:var(--green);color:var(--green-ink);font-weight:600;text-decoration:none;padding:12px 16px;border-radius:12px;white-space:nowrap}
.drive svg{width:18px;height:18px}
.drive:hover{filter:brightness(1.07)}
.fresh{display:flex;flex-wrap:wrap;gap:6px 22px;margin:22px 0 0;padding:0;font-size:13px;color:var(--night-muted);position:relative}
.fresh div{display:flex;gap:6px;align-items:baseline}
.fresh dt{margin:0}
.fresh dd{margin:0;color:var(--night-ink);font-weight:500}
.fresh .ok{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;align-self:center}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:28px;border-top:1px solid var(--night-line);position:relative}
.kpi{padding:20px 20px 4px 0;display:grid;gap:6px;align-content:start}
.kpi + .kpi{padding-left:20px;border-left:1px solid var(--night-line)}
.kpi .l{font-size:13.5px;color:var(--night-ink-2)}

@media (max-width:860px){

}
@media (max-width:560px){ .brand span{display:none} .band .bigglyph{width:300px;right:-110px;top:40px} }

/* ---------- section nav ---------- */
.secnav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.secnav ul{list-style:none;margin:0 auto;padding:0 20px;max-width:1140px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.secnav ul::-webkit-scrollbar{display:none}
.secnav a{display:block;padding:14px 10px 12px;font-size:14px;color:var(--ink-2);text-decoration:none;white-space:nowrap;border-bottom:2px solid transparent}
.secnav a:hover{color:var(--ink)}
.secnav a[aria-current="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--green)}

/* ---------- sections ---------- */
main{padding-bottom:72px}
section{padding-top:52px;display:grid;gap:18px}
.sec-head{display:grid;gap:8px;max-width:72ch}
.sec-head p{color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:18px}
@media (max-width:880px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2)}
.sw{flex-shrink:0;display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:6px}
.sw.line{height:3px;border-radius:2px;vertical-align:3px;width:16px}
.hatch{background:repeating-linear-gradient(135deg,var(--cost) 0 2px,transparent 2px 5px);box-shadow:inset 0 0 0 1px var(--cost)}
.vseg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.vseg button{font:inherit;font-size:12.5px;font-weight:500;padding:5px 11px;border:0;background:transparent;color:var(--ink-2);cursor:pointer}
.vseg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .hit{cursor:pointer;outline:none}
.chart .hit:focus-visible{stroke:var(--link);stroke-width:2}
.chart .band-hi{fill:var(--ink);opacity:0;transition:opacity .12s}
.chart .band-hi.on{opacity:.05}
.tip{position:absolute;z-index:5;pointer-events:none;background:var(--tip);color:var(--tip-ink);font-size:12.5px;line-height:1.5;padding:9px 11px;border-radius:9px;white-space:nowrap;opacity:0;transition:opacity .12s;box-shadow:0 6px 24px rgba(10,6,30,.25)}
.tip b{font-weight:600}
.tip .row{display:flex;justify-content:space-between;gap:18px}
.tip i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;box-shadow:0 0 0 1px color-mix(in srgb,var(--tip-ink) 50%,transparent)}
.callout{border-left:3px solid var(--green);padding:6px 0 6px 14px;color:var(--ink-2)}
.callout b{color:var(--ink);font-weight:600}
.small{font-size:12.5px;color:var(--muted)}

/* tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12.5px;color:var(--muted);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
td .note{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
tfoot td{font-weight:600;border-top:1px solid var(--line);border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--ink) 3%,transparent)}

/* horizontal bars */
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.bar-row:last-child{border-bottom:0}
.bar-row .lbl{font-size:14px}
.bar-row .lbl small{display:block;color:var(--muted);font-size:12.5px}
.bar-row .val{font-variant-numeric:tabular-nums;font-size:14px;text-align:right;white-space:nowrap}
.bar-row .val span{color:var(--muted)}
.bar-track{grid-column:1 / -1;height:8px;border-radius:4px;background:var(--line-soft);overflow:hidden}
.bar-fill{height:100%;border-radius:4px;background:var(--cost)}

/* stacked share bar (funding) and balance comparison */
.share{display:grid;gap:10px}
.share-top{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.share-top b{font-family:var(--f-display);font-size:26px;font-weight:700;display:block;line-height:1.05}
.share-bar{display:flex;gap:2px;height:30px}
.seg-b{min-width:3px;height:100%;cursor:pointer;outline:none;transition:filter .12s}
.seg-b:first-child{border-radius:6px 0 0 6px}
.seg-b:last-child{border-radius:0 6px 6px 0}
.seg-b:hover,.seg-b:focus-visible{filter:brightness(1.15)}
.seg-b:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.bal{display:grid;gap:14px}
.bal-row{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center}
.bal-row .k{font-size:14px;color:var(--ink-2)}
.bal-track{display:flex;gap:2px;align-items:center}
.bal-track .seg-b{height:26px}
.bal-track .tot{margin-left:10px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:560px){.bal-row{grid-template-columns:minmax(0,1fr);gap:6px}.hide-sm{display:none}}
.hatch{background:repeating-linear-gradient(135deg,var(--cost) 0 2px,transparent 2px 6px);box-shadow:inset 0 0 0 1.5px var(--cost)}

/* status + lists */
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.st svg{width:12px;height:12px}
.st.done{color:var(--good);background:var(--good-bg)}
.st.attention{color:var(--attn);background:var(--attn-bg)}
.st.pending{color:var(--pending);background:var(--pending-bg)}
.items{display:grid}
.item{display:grid;gap:6px;padding:14px 0;border-bottom:1px solid var(--line-soft)}
.item:first-child{padding-top:2px}
.item:last-child{border-bottom:0;padding-bottom:0}
.item .t{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.item p{color:var(--ink-2);font-size:14px}
.item .meta{font-size:12.5px;color:var(--muted)}
.bs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:760px){.bs{grid-template-columns:minmax(0,1fr)}}
.bs-total{display:flex;justify-content:space-between;font-weight:600;padding-top:10px;border-top:1px solid var(--line);margin-top:4px}
.payroll{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:8px}
.payroll div{background:var(--bg);border-radius:10px;padding:12px 14px}
.payroll .v{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.1}
.payroll .d{font-size:12.5px;color:var(--muted)}
.sources{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.src{display:grid;gap:4px;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-decoration:none;color:var(--ink);transition:border-color .15s}
.src:hover{border-color:var(--ext)}
.src span{font-size:13px;color:var(--ink-2)}
.src.main{background:var(--night);border-color:var(--night);color:#fff}
.src.main span{color:var(--night-ink-2)}
footer.foot{border-top:1px solid var(--line);padding-block:24px 40px}
footer.foot .wrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:start}
footer.foot svg{width:30px;height:auto;fill:var(--green)}
footer.foot p{font-size:12.5px;color:var(--muted);max-width:90ch}
footer.foot p + p{margin-top:6px}


/* traditional P&L + forecast */
.pnl td,.pnl th{white-space:nowrap}
.pnl td:first-child{white-space:normal;min-width:15rem}
.pnl tr.grp td{font-weight:600;color:var(--ink);padding-top:16px;border-bottom:0}
.pnl tr.ind td:first-child{padding-left:24px;color:var(--ink-2)}
.pnl tr.sub td{font-weight:600;border-top:1px solid var(--line)}
.pnl tr.key td{font-weight:700;background:color-mix(in srgb,var(--green) 9%,transparent)}
.pnl tr.pct td{color:var(--muted);font-size:13px;padding-top:2px}
.pnl tr.memo td{color:var(--muted);font-style:italic;border-top:1px dashed var(--line)}
.pnl .neg{color:var(--attn)}
.pnl tr.key .neg{color:var(--attn)}
.faq{display:grid;gap:14px}
.faq h4{margin:0;font-size:14.5px;font-weight:600}
.faq p{color:var(--ink-2);font-size:14px;margin-top:2px}
.pend{border:1.5px dashed var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:6px;background:var(--surface);align-content:start}
.pend .t{display:flex;justify-content:space-between;gap:12px;font-weight:600}
.pend small{color:var(--muted);font-size:12.5px;display:block}
.estb{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:6px;background:var(--pending-bg);color:var(--pending);vertical-align:3px;margin-left:8px;font-family:var(--f-body)}
.fkpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}

.fkpis > div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px;align-content:start}
.fkpis .l{font-size:13px;color:var(--ink-2)}
.fkpis .v{font-family:var(--f-display);font-size:clamp(22px,2.6vw,30px);font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.fkpis .v.neg{color:var(--attn)}
.fkpis .d{font-size:12.5px;color:var(--muted)}
.scen{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.scen .lbl{font-size:13px;color:var(--ink-2)}
.scen .vseg button{font-size:13.5px;padding:7px 14px}
.warnbox{border-left:3px solid var(--attn);background:var(--attn-bg);padding:10px 14px;border-radius:0 10px 10px 0;font-size:14px;color:var(--ink)}
.asm{margin:0;padding-left:18px;display:grid;gap:6px;color:var(--ink-2);font-size:14px}
.fcash{font-size:11.5px;fill:var(--muted)}
.fcash.neg{fill:var(--attn);font-weight:600}
td.sel,th.sel{background:color-mix(in srgb,var(--green) 10%,transparent)}
@media print{ .pane{display:block!important} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* hub: tabs, mentors, cash, team, documents */
.tabs{display:flex;gap:2px;max-width:1140px;margin:0 auto;padding:6px 20px 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font:inherit;font-size:15px;font-weight:600;padding:10px 14px 9px;border:0;border-bottom:2px solid transparent;background:none;color:var(--ink-2);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--green)}
.tabs .cnt{font-size:12px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--attn-bg);color:var(--attn)}
.secnav .sub{border-top:1px solid var(--line-soft)}
.secnav .sub a{padding:10px 10px 9px;font-size:13.5px}
.mstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px}

.mstats > div{background:var(--bg);border-radius:10px;padding:12px 14px;display:grid;gap:2px}
.mstats .v{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.1}
.mstats .d{font-size:12.5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill svg{width:12px;height:12px}
.pill.ok{color:var(--good);background:var(--good-bg)}
.pill.warn{color:var(--attn);background:var(--attn-bg)}
.pill.wait{color:var(--pending);background:var(--pending-bg)}
.cashlbl{font-size:11.5px;fill:var(--muted)}
.guide{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:8px;align-content:start}
.gcard h3{font-family:var(--f-display);font-size:19px;font-weight:700;line-height:1.15}
.gcard .fn{font-size:12.5px;color:var(--muted);margin-top:-4px}
.gcard p{color:var(--ink-2);font-size:14px}
.gcard .stats{display:flex;gap:6px 16px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.gcard .stats b{color:var(--ink);font-weight:600}
.gcard .links{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.gbtn{font-size:13px;font-weight:600;text-decoration:none;padding:6px 11px;border-radius:9px;border:1px solid var(--line);color:var(--ink);display:inline-flex;gap:6px;align-items:center}

.cov{display:grid;gap:3px;font-size:12.5px;overflow-x:auto;padding-bottom:4px}

.scroll{max-height:32rem;overflow:auto}

.docsearch{font:inherit;font-size:15px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:min(100%,26rem)}

.toolrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}

.show-sm,.note.show-sm{display:none}

.empty{color:var(--muted);font-size:14px;padding:10px 0}
/* ---------- monthly community reviews ---------- */
.revbtn{display:inline-flex;align-items:center;gap:10px;background:transparent;color:#fff;font-weight:600;text-decoration:none;padding:11px 16px;border-radius:12px;white-space:nowrap;border:1px solid var(--night-ink-2);font:inherit;font-size:15px;cursor:pointer}

#reviews{min-height:100vh;background:var(--bg)}

.rv-badge{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;vertical-align:middle;margin-left:8px}
.rv-badge.final{background:#EAF3DC;color:#3B7414}.rv-badge.draft{background:#FFF4D6;color:#5A4300}
.deck{position:relative;background:#000;border-radius:14px;overflow:hidden;box-shadow:0 10px 40px rgba(18,12,51,.25)}

.slide h3{font-family:var(--f-display);font-weight:800;font-size:3.3cqw;line-height:1.08;letter-spacing:-.02em;margin:0 0 1.6cqw;color:#fff;max-width:80%}
.slide.light h3{color:#17122E}
.slide .lead{font-size:1.7cqw;color:var(--night-ink-2);max-width:62%;line-height:1.45;margin:0}
.slide.light .lead{color:#4B4566}
.slide .foot{position:absolute;left:5.2cqw;right:5.2cqw;bottom:1.8cqw;display:flex;justify-content:space-between;font-size:.9cqw;color:var(--night-muted);letter-spacing:.08em;text-transform:uppercase}
.slide.light .foot{color:#77728E}
.slide .foot svg{height:1.4cqw;width:auto}
.s-cover h3{font-size:5.4cqw;max-width:70%;margin-top:auto}

.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(18cqw,1fr));gap:1.4cqw;margin-top:2.6cqw}
.kpi2{background:rgba(28,21,72,.75);border:1px solid var(--night-line);border-radius:1.2cqw;padding:1.6cqw}
.slide.light .kpi2{background:#fff;border-color:#E2DFEC}
.kpi2 .v{font-family:var(--f-display);font-weight:800;font-size:3.6cqw;line-height:1;color:var(--green);font-variant-numeric:tabular-nums}
.slide.light .kpi2 .v{color:#17122E}
.kpi2 .l{font-weight:600;font-size:1.45cqw;margin-top:.8cqw}
.kpi2 .n{font-size:1.2cqw;color:var(--night-muted);margin-top:.4cqw;line-height:1.35}
.slide.light .kpi2 .n{color:#77728E}
.tl{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:1.2cqw;margin-top:auto;position:relative}
.tl:before{content:"";position:absolute;left:0;right:0;top:.55cqw;height:2px;background:var(--night-line)}
.tl div{position:relative;padding-top:2cqw}
.tl div:before{content:"";position:absolute;top:0;left:0;width:1.1cqw;height:1.1cqw;border-radius:50%;background:var(--green)}
.tl b{display:block;font-family:var(--f-display);font-size:1.3cqw;color:var(--green);letter-spacing:.04em}
.tl strong{display:block;font-size:1.6cqw;margin:.5cqw 0 .4cqw;color:#fff;line-height:1.2}
.tl span{font-size:1.25cqw;color:var(--night-ink-2);line-height:1.4;display:block}
.cgrid{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:1.3cqw;margin-top:2.4cqw}
.card2{background:#fff;border:1px solid #E2DFEC;border-radius:1.2cqw;padding:1.6cqw;color:#17122E;display:flex;flex-direction:column;gap:.6cqw}
.slide:not(.light) .card2{background:rgba(28,21,72,.75);border-color:var(--night-line);color:var(--night-ink)}
.card2 .tag{font-family:var(--f-display);font-weight:700;font-size:.95cqw;letter-spacing:.12em;text-transform:uppercase;color:#4E7A00}
.slide:not(.light) .card2 .tag{color:var(--green)}
.card2 strong{font-size:1.65cqw;line-height:1.2}
.card2 span{font-size:1.28cqw;line-height:1.42;color:#4B4566}
.slide:not(.light) .card2 span{color:var(--night-ink-2)}
.st{display:inline-flex;align-items:center;gap:.4cqw;font-size:.95cqw;font-weight:700;padding:.25cqw .7cqw;border-radius:99px;align-self:flex-start}
.st.done{background:#EAF3DC;color:#3B7414}.st.wip{background:#FFF4D6;color:#5A4300}.st.miss{background:#F8E7E2;color:#B4432C}.st.unk{background:#ECEAF4;color:#5D5880}
.rtab{width:100%;border-collapse:collapse;font-size:1.28cqw;margin-top:2cqw}
.rtab th{text-align:left;font-family:var(--f-display);font-size:.9cqw;letter-spacing:.1em;text-transform:uppercase;color:#77728E;padding:.6cqw .8cqw;border-bottom:2px solid #E2DFEC}
.rtab td{padding:.75cqw .8cqw;border-bottom:1px solid #EEECF4;vertical-align:top;line-height:1.35}
.slide:not(.light) .rtab th{color:var(--night-muted);border-color:var(--night-line)}
.slide:not(.light) .rtab td{border-color:var(--night-line)}
.rtab td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pgrid{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:1.2cqw;margin-top:2cqw;min-height:0;flex:1}
.pgrid figure{margin:0;display:flex;flex-direction:column;gap:.6cqw;min-height:0}
.pgrid img{width:100%;flex:1;min-height:0;object-fit:cover;border-radius:1cqw}
.pgrid figcaption{font-size:1.2cqw;color:var(--night-ink-2)}
.cols2{display:grid;grid-template-columns:repeat(var(--n,2),1fr);gap:2cqw;margin-top:2.4cqw}
.cols2 h4{font-family:var(--f-display);font-size:1.35cqw;letter-spacing:.12em;text-transform:uppercase;color:var(--green);margin:0 0 .8cqw}
.slide.light .cols2 h4{color:#4E7A00}
.cols2 ul{margin:0;padding-left:1.6cqw;font-size:1.55cqw;line-height:1.45}
.cols2 li{margin:.35cqw 0}
.s-close h3{font-size:4cqw;margin-top:auto}
.rsrc{font-size:.95cqw;color:var(--night-muted);margin:1.2cqw 0 0}
.slide.light .rsrc{color:#77728E}
.dctl{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap}
.dctl .nav{display:flex;align-items:center;gap:8px}
.dctl button,.rvb{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.dctl button:hover,.rvb:hover{border-color:var(--ink-2)}
.rvb.pri{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.dctl .cnt{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;min-width:4.5em;text-align:center}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px}
.thumbs button{flex:0 0 auto;border:2px solid transparent;border-radius:8px;padding:0;background:var(--night);color:var(--night-ink-2);cursor:pointer;width:118px;aspect-ratio:16/9;font:inherit;font-size:11px;text-align:left;overflow:hidden;position:relative}
.thumbs button span{position:absolute;left:8px;right:8px;bottom:6px;line-height:1.2}
.thumbs button b{position:absolute;left:8px;top:6px;color:var(--green);font-size:10px}
.thumbs button[aria-current="true"]{border-color:var(--green)}
.hist{margin-top:34px}
.hist h3{font-size:20px;margin:0 0 4px}
.hist>p{color:var(--ink-2);font-size:14px;margin:0 0 14px}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:6px}
.hcard[aria-current="true"]{border-color:var(--green);box-shadow:0 0 0 2px rgba(147,193,31,.35)}
.hcard .d{font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.hcard strong{font-size:16px;line-height:1.25}
.hcard .k{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.hcard .k b{color:var(--ink);font-variant-numeric:tabular-nums}
.rv-note{font-size:13px;color:var(--muted);margin-top:12px}
@media (max-width:700px){.thumbs button{width:96px}}
@media print{
  body.print-deck #dash,body.print-deck .rv-top,body.print-deck .dctl,body.print-deck .thumbs,body.print-deck .hist,body.print-deck .rv-head,body.print-deck .rv-note{display:none!important}
  body.print-deck #reviews{background:#fff}
  body.print-deck .rv-main{padding:0;max-width:none}
  body.print-deck .deck{box-shadow:none;border-radius:0;background:none}
  body.print-deck .slide{display:block!important;width:100vw;height:100vh;aspect-ratio:auto;break-after:page;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body.print-deck .slide:last-child{break-after:auto}
}
@media print{
  body{background:#fff}
  .secnav,.tools,.vseg,.drive,.revbtn{display:none!important}
  .band{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  [data-view-panel]{display:block!important}
  section{break-inside:avoid-page;padding-top:28px}
  .panel{break-inside:avoid}
}
</style>

/* ---------- decrypt ---------- */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pw){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

async function unlock(pw, remembered){
  btn.disabled = true;
  say(remembered ? 'opening' : 'checking');
  glyph.classList.remove('draw'); glyph.classList.add('tracing');
  try {
    const data = await decrypt(pw);
    try { sessionStorage.setItem('ardenPw', pw); } catch(_) {}
    glyph.classList.remove('tracing'); glyph.classList.add('opened');
    say('openingDash');
    if (!REDUCED && !remembered) { document.getElementById('gate').classList.add('leaving'); await wait(700); }
    render(data, true);
  } catch(_) {
    glyph.classList.remove('tracing');
    btn.disabled = false;
    if (remembered) { say(null); try { sessionStorage.removeItem('ardenPw'); } catch(_) {} return; }
    pwbox.classList.add('bad');
    say('bad', true);
    pwIn.select();
  }
}

});

function guideOf(d, name){ return (d.folderGuide || []).find(g => g.folder === name) || {folder:name, label:name, purpose:'', owner:'', monthly:false}; }
function areaLabel(d, name){ return dx(guideOf(d, name).label); }
function ownerKeys(o){ const s = String(o || ''); return {acc: /accountant/i.test(s), mgmt: /management/i.test(s)}; }
function teamModel(d){
  const now = new Date(), y = now.getFullYear(), cm = now.getMonth() + 1;
  const prev = cm - 1;
  const last = y > 2026 ? 12 : (y < 2026 ? 0 : prev);
  const cov = (d.drive && d.drive.coverage) || [];
  const gaps = [];
  (d.folderGuide || []).filter(g => g.monthly).forEach(g => {
    const rows = cov.filter(c => c.area === g.folder);
    const eeff = /Estados financieros/.test(g.folder);
    const lastWith = Math.max(0, ...rows.filter(c => c.files > 0).map(c => c.month));
    for (let mth = 1; mth <= last; mth++) {
      const c = rows.find(r => r.month === mth) || {files:0};
      if (eeff && mth <= lastWith) continue;
      const exp = g.folder === 'Nominas' ? NOMINA_EXPECTED : 1;
      if (c.files >= exp) continue;
      gaps.push({area:g.folder, month:mth, files:c.files, expected:exp, owner:g.owner, current: mth === last});
    }
  });
  return {cm, prev: last, gaps, now: gaps.filter(g => g.current), older: gaps.filter(g => !g.current)};
}

}

/* ---------- tooltips ---------- */
function placeTip(host, tip, html, x, y){
  tip.innerHTML = html;
  tip.style.opacity = 1;
  const hw = host.clientWidth, tw = tip.offsetWidth, th = tip.offsetHeight;
  const left = Math.max(0, Math.min(hw - tw, x - tw/2));
  tip.style.left = left + 'px';
  tip.style.top = Math.max(-th - 4, y - th - 10) + 'px';
}
const hideTip = tip => { tip.style.opacity = 0; };
const trow = (sw, label, val) => `<div class="row"><span>${sw?`<i style="background:${sw}"></i>`:''}${label}</span><b>${val}</b></div>`;

/* ---------- charts ---------- */
function niceMax(v){ const p = Math.pow(10, Math.floor(Math.log10(v))); for (const k of [1,1.5,2,2.5,3,4,5,6,8,10]) if (k*p >= v) return k*p; return 10*p; }
function barPath(x, y, w, h, r){
  r = Math.min(r, h, w/2);
  return `M${x},${y+h} L${x},${y+r} Q${x},${y} ${x+r},${y} L${x+w-r},${y} Q${x+w},${y} ${x+w},${y+r} L${x+w},${y+h} Z`;
}

function monthlyChart(d){
  const host = document.getElementById('chMonthly');
  if (!host || host.hidden) return;
  const W = Math.max(320, host.clientWidth), H = W < 520 ? 260 : 320, L = 52, R = 6, T0 = 14, B = 30;
  const n = d.months.length, iw = W - L - R, ih = H - T0 - B;
  const tot = d.months.map((_,i)=>d.revenueAmber[i]+d.revenueExternal[i]);
  const mx = niceMax(Math.max(...tot, ...d.operatingCost));
  const y = v => T0 + ih - (v/mx)*ih;
  const band = iw / n, bw = Math.min(52, band*0.56);
  const cx = i => L + band*i + band/2;
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('mAria')}">`;
  for (let k=0;k<=4;k++){ const v=mx*k/4, yy=y(v); s+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line-soft)" stroke-width="1"/><text x="${L-8}" y="${yy+4}" text-anchor="end" font-size="11.5" fill="var(--muted)" style="font-variant-numeric:tabular-nums">${money(v)}</text>`; }
  d.months.forEach((_,i)=>{ s+=`<rect class="band-hi" data-bi="${i}" x="${L+band*i+2}" y="${T0}" width="${band-4}" height="${ih}" rx="6"/>`; });
  d.months.forEach((mo,i)=>{
    const a=d.revenueAmber[i], e=d.revenueExternal[i], x=cx(i)-bw/2;
    const yE=y(e), hE=ih+T0-yE;
    if (e>0) s+=`<path d="${barPath(x, yE, bw, hE, a>0?0:4)}" fill="var(--ext)"/>`;
    if (a>0){ const yA=y(e+a), hA=y(e)-yA-(e>0?2:0); s+=`<path d="${barPath(x, yA, bw, Math.max(hA,1), 4)}" fill="var(--amber)"/>`; }
    s+=`<text x="${cx(i)}" y="${H-9}" text-anchor="middle" font-size="12.5" fill="var(--ink-2)">${monAxis(mo)}</text>`;
  });
  const pts = d.operatingCost.map((v,i)=>`${cx(i)},${y(v)}`).join(' ');
  s+=`<polyline points="${pts}" fill="none" stroke="var(--cost)" stroke-width="2" stroke-linejoin="round"/>`;
  d.operatingCost.forEach((v,i)=>{ s+=`<circle cx="${cx(i)}" cy="${y(v)}" r="4.5" fill="var(--cost)" stroke="var(--surface)" stroke-width="2"/>`; });
  s+=`<line x1="${L}" x2="${W-R}" y1="${T0+ih}" y2="${T0+ih}" stroke="var(--line)"/>`;
  d.months.forEach((mo,i)=>{ s+=`<rect class="hit" tabindex="0" data-i="${i}" x="${L+band*i}" y="${T0}" width="${band}" height="${ih+B}" fill="transparent" aria-label="${monL(mo)}"/>`; });
  s+=`</svg><div class="tip" id="tipM"></div>`;
  host.innerHTML = s;
  const tip = host.querySelector('#tipM');
  host.querySelectorAll('.hit').forEach(r=>{
    const show = () => {
      const i=+r.dataset.i, a=d.revenueAmber[i], e=d.revenueExternal[i], c=d.operatingCost[i];
      host.querySelectorAll('.band-hi').forEach(b=>b.classList.toggle('on', +b.dataset.bi===i));
      placeTip(host, tip, `<b>${cap(monL(d.months[i]))} 2026</b>${trow('var(--amber)',t('amber'),money(a))}${trow('var(--ext)',t('ext'),money(e))}${trow('var(--cost)',t('cost'),money(c))}<div class="row" style="border-top:1px solid color-mix(in srgb,var(--tip-ink) 25%,transparent);margin-top:4px;padding-top:4px"><span>${t('result')}</span><b>${money(a+e-c)}</b></div>`, cx(i), y(Math.max(a+e,c)));
    };
    const hide = () => { hideTip(tip); host.querySelectorAll('.band-hi').forEach(b=>b.classList.remove('on')); };
    r.addEventListener('mouseenter', show); r.addEventListener('focus', show); r.addEventListener('click', show);
    r.addEventListener('mouseleave', hide); r.addEventListener('blur', hide);
  });
}

function coverChart(d){
  const host = document.getElementById('chCover');
  const W = Math.max(300, host.clientWidth), H = 250, L = 40, R = 6, T0 = 22, B = 30;
  const n = d.months.length, iw = W-L-R, ih = H-T0-B;
  const vals = d.months.map((_,i)=> d.revenueExternal[i]/d.operatingCost[i]);
  const mx = 1.2, y = v => T0 + ih - (Math.min(v,mx)/mx)*ih;
  const band = iw/n, bw = Math.min(38, band*0.55), cx = i => L + band*i + band/2;
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('cAria')}">`;
  [0,.5,1].forEach(v=>{ const yy=y(v); s+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="${v===1?'var(--ink-2)':'var(--line-soft)'}" stroke-width="1" ${v===1?'stroke-dasharray="4 4"':''}/><text x="${L-6}" y="${yy+4}" text-anchor="end" font-size="11.5" fill="var(--muted)">${pct(v)}</text>`; });
  vals.forEach((v,i)=>{
    const yy=y(v), h=T0+ih-yy;
    if (h>0.5) s+=`<path d="${barPath(cx(i)-bw/2, yy, bw, h, 4)}" fill="var(--ext)"/>`;
    if (v>0.6) s+=`<text x="${cx(i)}" y="${yy-7}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)">${pct(v)}</text>`;
    s+=`<text x="${cx(i)}" y="${H-9}" text-anchor="middle" font-size="12.5" fill="var(--ink-2)">${monAxis(d.months[i])}</text>`;
  });
  s+=`<line x1="${L}" x2="${W-R}" y1="${T0+ih}" y2="${T0+ih}" stroke="var(--line)"/>`;
  vals.forEach((v,i)=>{ s+=`<rect class="hit" tabindex="0" data-i="${i}" x="${L+band*i}" y="${T0}" width="${band}" height="${ih+B}" fill="transparent" aria-label="${monL(d.months[i])}: ${pct(v)}"/>`; });
  s+=`</svg><div class="tip" id="tipC"></div>`;
  host.innerHTML = s;
  const tip = host.querySelector('#tipC');
  host.querySelectorAll('.hit').forEach(r=>{
    const show = () => { const i=+r.dataset.i; placeTip(host, tip, `<b>${cap(monL(d.months[i]))} 2026</b>${trow('var(--ext)',t('extRev'),money(d.revenueExternal[i]))}${trow('',t('opCost'),money(d.operatingCost[i]))}${trow('',t('covered'),pct(vals[i]))}`, cx(i), y(Math.max(vals[i],0))); };
    r.addEventListener('mouseenter', show); r.addEventListener('focus', show); r.addEventListener('click', show);
    r.addEventListener('mouseleave', ()=>hideTip(tip)); r.addEventListener('blur', ()=>hideTip(tip));
  });
}

function segTips(hostSel, tipId, htmlFor){
  const host = document.querySelector(hostSel)?.closest('.chart'); if (!host) return;
  const tip = document.getElementById(tipId);
  host.querySelectorAll('.seg-b').forEach(seg=>{
    const show = () => { const hb = host.getBoundingClientRect(), sb = seg.getBoundingClientRect(); placeTip(host, tip, htmlFor(seg), sb.left - hb.left + sb.width/2, sb.top - hb.top); };
    seg.addEventListener('mouseenter', show); seg.addEventListener('focus', show); seg.addEventListener('click', show);
    seg.addEventListener('mouseleave', ()=>hideTip(tip)); seg.addEventListener('blur', ()=>hideTip(tip));
  });
}


function cashChart(d){
  const host = document.getElementById('chCash');
  if (!host || !d.bank || host.offsetParent === null) return;

function pnlModel(d){
  const L = d.pnl.lines, n = d.pnl.months.length;
  const at = (k,i) => L[k][i];
  const per = i => {
    const amber = at('amber',i), ext = at('ext',i), rev = amber + ext, direct = at('direct',i);
    const gross = rev - direct;
    const opex = at('payroll',i) + at('admin',i) + at('facilities',i) + at('other',i);
    const ebitda = gross - opex, ebit = ebitda - at('dep',i), net = ebit - at('bank',i);
    return {amber, ext, rev, direct, gross, payroll:at('payroll',i), admin:at('admin',i), facilities:at('facilities',i), other:at('other',i), opex, ebitda, dep:at('dep',i), ebit, bank:at('bank',i), net, memo: net - amber};
  };
  const months = [...Array(n).keys()].map(per);
  const agg = idx => { const o = {}; Object.keys(months[0]).forEach(k => o[k] = sum(idx.map(i => months[i][k]))); return o; };
  return {months, agg, all: agg([...Array(n).keys()])};
}

function showTab(id, d){

  document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === id)));
  document.querySelectorAll('.pane').forEach(p => p.hidden = p.id !== 'pane-' + id);
  const sub = document.querySelector('.secnav .sub'); if (sub) sub.hidden = id !== 'status';

  if (id === 'status') { monthlyChart(d); coverChart(d); cashChart(d); }
  if (id === 'docs') docTable(d);

  const top = document.querySelector('.secnav'); if (top && window.scrollY > top.offsetTop) window.scrollTo(0, top.offsetTop);

  const ds = document.getElementById('docSearch'); if (ds) ds.addEventListener('input', () => { DOCQ = ds.value; docTable(d); });
  const paid = d.customers.filter(c=>c.collected>0), allCash = sum(paid.map(c=>c.collected));
  segTips('#shareBar', 'tipS', seg => { const c = paid[+seg.dataset.c]; return `<b>${esc(dx(c.name))}</b>${trow(/amber/i.test(c.name)?'var(--amber)':'var(--ext)',t('collected'),money(c.collected))}${trow('',t('share'),pct(c.collected/allCash))}`; });
  segTips('#balBars', 'tipB', seg => `<b>${seg.dataset.l}</b>${trow('',t('amount'),money(+seg.dataset.v))}`);

  document.querySelectorAll('[data-cur]').forEach(b=> b.addEventListener('click', ()=>{
    CUR = b.dataset.cur; try { localStorage.setItem('ardenCur', CUR); } catch(_) {}
    render(DATA);
  }));
  document.querySelectorAll('[data-view]').forEach(b=> b.addEventListener('click', ()=>{
    VIEW_MONTHLY = b.dataset.view;
    document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed', String(x===b)));
    document.querySelectorAll('[data-view-panel]').forEach(p=>p.hidden = p.dataset.viewPanel !== VIEW_MONTHLY);
    monthlyChart(d);
  }));
  document.getElementById('themeBtn').addEventListener('click', ()=>{
    const root = document.documentElement;
    const cur = root.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const next = cur === 'dark' ? 'light' : 'dark';
    root.dataset.theme = next; try { localStorage.setItem('ardenTheme', next); } catch(_) {}
  });
  document.getElementById('printBtn').addEventListener('click', ()=> window.print());
  const rb = document.getElementById('revBtn'); if (rb) rb.addEventListener('click', () => rvOpen(true));
  document.getElementById('lockBtn').addEventListener('click', ()=>{ try { sessionStorage.removeItem('ardenPw'); } catch(_) {} location.reload(); });

  const links = [...document.querySelectorAll('.secnav a')];
  const secs = links.map(a => document.querySelector(a.getAttribute('href'))).filter(Boolean);
  if (window.__spy) window.__spy.disconnect();
  window.__spy = new IntersectionObserver(entries => {
    entries.forEach(en => { if (en.isIntersecting) links.forEach(a => a.setAttribute('aria-current', String(a.getAttribute('href') === '#' + en.target.id))); });
  }, {rootMargin:'-30% 0px -60% 0px'});
  secs.forEach(s => window.__spy.observe(s));
}

/* ---------- monthly community reviews ---------- */
let RV_ID = null, RS = 0;
const RV_ST = {done:'Done', wip:'In progress', miss:'Not done', unk:'Pending'};
function rvList(d){ return (d.reviews || []).slice().sort((a, b) => b.date.localeCompare(a.date)); }
function rvx(s){ return esc(s == null ? '' : s); }
function rvDate(iso){ try { return new Date(iso + 'T12:00:00').toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}); } catch(_) { return iso; } }
function rvImg(src){ return /^(data:image\/(png|jpe?g|webp);base64,|https:\/\/)/.test(src || '') ? src : ''; }
function rvSt(s){ const k = RV_ST[s] ? s : 'unk'; return `<span class="st ${k}">${RV_ST[k]}</span>`; }
function rvSlide(s, r, i, n){
  const light = s.theme === 'light';
  const bg = light ? '' : `<div class="sky-bg"></div><svg class="gl" viewBox="0 0 152.1 174.7" aria-hidden="true"><use href="#g-glyph"/></svg>`;
  const head = (s.eyebrow ? `<p class="eb">${rvx(s.eyebrow)}</p>` : '') + (s.title ? `<h3>${rvx(s.title)}</h3>` : '') + (s.lead ? `<p class="lead">${rvx(s.lead)}</p>` : '');
  const src = s.source ? `<p class="rsrc">${rvx(s.source)}</p>` : '';
  let body = '';
  if (s.type === 'cover') {
    return `<section class="slide s-cover" aria-label="Slide ${i+1}">${bg}<div class="in">
      <div class="logo"><svg class="g" viewBox="0 0 152.1 174.7" aria-hidden="true"><use href="#g-glyph"/></svg><svg class="w" viewBox="0 0 242.6 37.1" aria-hidden="true"><use href="#g-word" width="242.6" height="37.1"/></svg></div>
      ${s.eyebrow ? `<p class="eb" style="margin-top:auto">${rvx(s.eyebrow)}</p>` : ''}<h3 style="${s.eyebrow ? 'margin-top:0' : ''}">${rvx(s.title)}</h3>${s.lead ? `<p class="lead">${rvx(s.lead)}</p>` : ''}
      ${s.meta ? `<p class="meta">${rvx(s.meta)}</p>` : ''}</div>
      <div class="foot"><span>Arden AC · Confidential</span><span>${i+1} / ${n}</span></div></section>`;
  }
  if (s.type === 'kpis') body = `<div class="kgrid">${(s.kpis || []).map(k => `<div class="kpi2"><div class="v">${rvx(k.v)}</div><div class="l">${rvx(k.l)}</div>${k.n ? `<div class="n">${rvx(k.n)}</div>` : ''}</div>`).join('')}</div>`;
  if (s.type === 'timeline') body = `<div class="tl">${(s.items || []).map(x => `<div><b>${rvx(x.d)}</b><strong>${rvx(x.t)}</strong><span>${rvx(x.x)}</span></div>`).join('')}</div>`;
  if (s.type === 'cards') body = `<div class="cgrid" style="--n:${s.cols || Math.min((s.cards || []).length, 3)}">${(s.cards || []).map(c => `<div class="card2">${c.tag ? `<span class="tag">${rvx(c.tag)}</span>` : ''}<strong>${rvx(c.t)}</strong>${c.x ? `<span>${rvx(c.x)}</span>` : ''}${c.status ? rvSt(c.status) : ''}</div>`).join('')}</div>`;
  if (s.type === 'table') body = `<table class="rtab"><thead><tr>${(s.cols || []).map((c, j) => `<th${(s.num || []).includes(j) ? ' style="text-align:right"' : ''}>${rvx(c)}</th>`).join('')}</tr></thead><tbody>${(s.rows || []).map(row => `<tr>${row.map((c, j) => `<td${(s.num || []).includes(j) ? ' class="num"' : ''}>${j === s.statusCol ? rvSt(c) : rvx(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  if (s.type === 'scorecard') body = `<table class="rtab"><thead><tr><th>${rvx(s.h1 || 'Commitment')}</th><th>Status</th><th>${rvx(s.h3 || 'Evidence')}</th></tr></thead><tbody>${(s.rows || []).map(x => `<tr><td><strong>${rvx(x.item)}</strong></td><td>${rvSt(x.status)}</td><td>${rvx(x.ev)}</td></tr>`).join('')}</tbody></table>`;
  if (s.type === 'photos') body = `<div class="pgrid" style="--n:${Math.min((s.photos || []).length, 4) || 1}">${(s.photos || []).filter(p => rvImg(p.src)).map(p => `<figure><img src="${rvImg(p.src)}" alt="${rvx(p.cap)}"><figcaption>${rvx(p.cap)}</figcaption></figure>`).join('')}</div>`;
  if (s.type === 'cols') body = `<div class="cols2" style="--n:${(s.cols || []).length || 2}">${(s.cols || []).map(c => `<div><h4>${rvx(c.h)}</h4><ul>${(c.items || []).map(it => `<li>${rvx(it)}</li>`).join('')}</ul></div>`).join('')}</div>`;
  if (s.type === 'close') return `<section class="slide s-close" aria-label="Slide ${i+1}">${bg}<div class="in">${s.eyebrow ? `<p class="eb" style="margin-top:auto">${rvx(s.eyebrow)}</p>` : ''}<h3 style="${s.eyebrow ? 'margin-top:0' : ''}">${rvx(s.title)}</h3>${s.lead ? `<p class="lead">${rvx(s.lead)}</p>` : ''}${src}</div><div class="foot"><span>Arden AC · Community Review · ${rvx(rvDate(r.date))}</span><span>${i+1} / ${n}</span></div></section>`;
  return `<section class="slide ${light ? 'light' : ''} s-${rvx(s.type)}" aria-label="Slide ${i+1}">${bg}<div class="in">${head}${body}${src}</div><div class="foot"><span>Arden AC · Community Review · ${rvx(rvDate(r.date))}</span><span>${i+1} / ${n}</span></div></section>`;
}
function rvView(d){
  const list = rvList(d);
  const r = list.find(x => x.id === RV_ID) || list[0];
  const top = `<div class="rv-top"><div class="wrap"><div class="left"><button type="button" class="ibtn" id="rvBack">← ${t('rvBack')}</button><h1>${t('revBtn')}</h1></div><div class="tools">${langSeg()}<button type="button" class="ibtn" id="rvLock">${SVGI.lock}<span>${t('lock')}</span></button></div></div></div>`;
  if (!r) return top + `<main class="wrap rv-main"><p class="empty">${t('rvNone')}</p></main>`;
  RV_ID = r.id;
  const n = r.slides.length; if (RS >= n) RS = 0;
  const slides = r.slides.map((s, i) => rvSlide(s, r, i, n).replace('class="slide', `class="slide${i === RS ? ' on' : ''}`)).join('');
  const thumbs = r.slides.map((s, i) => `<button type="button" data-rs="${i}" aria-current="${i === RS}" aria-label="Slide ${i+1}"><b>${i+1}</b><span>${rvx(s.title || s.eyebrow || '')}</span></button>`).join('');
  const hist = list.map(x => `<button type="button" class="hcard" data-rv="${rvx(x.id)}" aria-current="${x.id === r.id}"><span class="d">${rvx(rvDate(x.date))} <span class="rv-badge ${x.status === 'final' ? 'final' : 'draft'}">${x.status === 'final' ? t('rvFinal') : t('rvDraft')}</span></span><strong>${rvx(x.title)}</strong>${x.summary ? `<span style="font-size:13.5px;color:var(--ink-2)">${rvx(x.summary)}</span>` : ''}<span class="k">${(x.highlights || []).map(h => `<span><b>${rvx(h.v)}</b> ${rvx(h.l)}</span>`).join('')}</span></button>`).join('');
  return top + `<main class="wrap rv-main">
    <div class="rv-head"><div><h2>${rvx(r.title)} <span class="rv-badge ${r.status === 'final' ? 'final' : 'draft'}">${r.status === 'final' ? t('rvFinal') : t('rvDraft')}</span></h2><p>${rvx(rvDate(r.date))}${r.period ? ' · ' + t('rvPeriod', {a: rvx(rvDate(r.period.from)), b: rvx(rvDate(r.period.to))}) : ''}</p></div>
    <div class="nav" style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="rvb pri" id="rvPresent">▶ ${t('rvPresent')}</button><button type="button" class="rvb" id="rvPdf">${SVGI.print} ${t('rvPdf')}</button></div></div>
    <div class="deck" id="deck"><div class="slides">${slides}</div></div>
    <div class="dctl"><div class="nav"><button type="button" id="rvPrev" aria-label="${t('rvPrev')}">←</button><span class="cnt" id="rvCnt">${RS+1} / ${n}</span><button type="button" id="rvNext" aria-label="${t('rvNext')}">→</button></div><span class="rv-note">${t('rvKeys')}</span></div>
    <div class="thumbs" role="tablist">${thumbs}</div>
    ${r.sources ? `<p class="rv-note">${t('rvSources')}: ${rvx(r.sources)}</p>` : ''}
    <section class="hist"><h3>${t('rvHist')}</h3><p>${t('rvHistSub')}</p><div class="hgrid">${hist}</div></section>
  </main>`;
}
function rvGo(i){
  const sl = [...document.querySelectorAll('#deck .slide')]; if (!sl.length) return;
  RS = Math.max(0, Math.min(sl.length - 1, i));
  sl.forEach((s, j) => s.classList.toggle('on', j === RS));
  document.querySelectorAll('[data-rs]').forEach((b, j) => b.setAttribute('aria-current', String(j === RS)));
  const c = document.getElementById('rvCnt'); if (c) c.textContent = `${RS+1} / ${sl.length}`;
  const th = document.querySelector(`[data-rs="${RS}"]`); if (th && th.parentNode) th.parentNode.scrollLeft = th.offsetLeft - th.parentNode.clientWidth / 2 + th.clientWidth / 2;
}
function rvRender(d){
  const el = document.getElementById('reviews');
  el.innerHTML = rvView(d);
  document.getElementById('rvBack').addEventListener('click', () => rvOpen(false));
  document.getElementById('rvLock').addEventListener('click', () => { try { sessionStorage.removeItem('ardenPw'); } catch(_) {} location.reload(); });
  const q = id => document.getElementById(id);
  if (q('rvPrev')) q('rvPrev').addEventListener('click', () => rvGo(RS - 1));
  if (q('rvNext')) q('rvNext').addEventListener('click', () => rvGo(RS + 1));
  document.querySelectorAll('[data-rs]').forEach(b => b.addEventListener('click', () => rvGo(+b.dataset.rs)));
  document.querySelectorAll('[data-rv]').forEach(b => b.addEventListener('click', () => { RV_ID = b.dataset.rv; RS = 0; rvRender(d); window.scrollTo(0, 0); }));
  if (q('rvPresent')) q('rvPresent').addEventListener('click', () => { const dk = q('deck'); if (dk.requestFullscreen) dk.requestFullscreen().catch(() => {}); else if (dk.webkitRequestFullscreen) dk.webkitRequestFullscreen(); });
  if (q('rvPdf')) q('rvPdf').addEventListener('click', () => {
    const st = document.createElement('style'); st.id = 'rvPage'; st.textContent = '@page{size:13.333in 7.5in;margin:0}';
    document.head.appendChild(st); document.body.classList.add('print-deck');
    const done = () => { document.body.classList.remove('print-deck'); st.remove(); removeEventListener('afterprint', done); };
    addEventListener('afterprint', done); window.print(); setTimeout(done, 60000);
  });
  if (q('deck')) {
    let x0 = null;
    q('deck').addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, {passive:true});
    q('deck').addEventListener('touchend', e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) rvGo(RS + (dx < 0 ? 1 : -1)); x0 = null; });
    q('deck').addEventListener('click', e => { if (document.fullscreenElement) rvGo(RS + (e.clientX > innerWidth / 2 ? 1 : -1)); });
  }
}
function rvOpen(open, push = true){
  const dash = document.getElementById('dash'), rv = document.getElementById('reviews');
  if (open) { rvRender(DATA); dash.hidden = true; rv.hidden = false; window.scrollTo(0, 0); if (push) try { history.pushState(null, '', '#reviews'); } catch(_) {} }
  else { rv.hidden = true; dash.hidden = false; if (push) try { history.pushState(null, '', location.pathname); } catch(_) {} }
}
addEventListener('popstate', () => { if (!DATA) return; rvOpen(location.hash === '#reviews', false); });
addEventListener('keydown', e => {
  const rv = document.getElementById('reviews'); if (!rv || rv.hidden) return;
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); rvGo(RS + 1); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); rvGo(RS - 1); }
  if (e.key === 'Home') rvGo(0);
});

let rT;
addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { if (DATA) { monthlyChart(DATA); coverChart(DATA); cashChart(DATA); forecastChart(DATA); } }, 150); });
</script>

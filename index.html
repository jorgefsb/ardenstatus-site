<title>Arden Sponsor Status</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a sponsor ledger. Freshness strip first, four headline figures, then sections that each answer one sponsor question. */
:root{
  --bg:#F2F3EF; --surface:#FBFBF9; --ink:#17201C; --ink-2:#47524C; --muted:#737D78; --line:#DCE0D9; --line-soft:#E8EBE5;
  --amber:#B7791F; --ext:#008A74; --cost:#3B4A44; --accent:#1F4766; --accent-ink:#FFFFFF;
  --good:#2E7D4F; --attn:#B4472F; --pending:#566676;
  --good-bg:#E4F1E8; --attn-bg:#F6E6E1; --pending-bg:#E6EAEE;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111513; --surface:#191E1B; --ink:#E7ECE8; --ink-2:#B3BCB6; --muted:#88928C; --line:#2B332F; --line-soft:#222925;
  --amber:#B57A18; --ext:#14A08A; --cost:#C9D3CD; --accent:#8DB3D6; --accent-ink:#0E1A24;
  --good:#5DBB83; --attn:#E2836B; --pending:#9FB0C0;
  --good-bg:#1C2C22; --attn-bg:#33201B; --pending-bg:#1F262D; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#191E1B; --ink:#E7ECE8; --ink-2:#B3BCB6; --muted:#88928C; --line:#2B332F; --line-soft:#222925;
  --amber:#B57A18; --ext:#14A08A; --cost:#C9D3CD; --accent:#8DB3D6; --accent-ink:#0E1A24;
  --good:#5DBB83; --attn:#E2836B; --pending:#9FB0C0;
  --good-bg:#1C2C22; --attn-bg:#33201B; --pending-bg:#1F262D; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:28px 64px}
h1,h2,h3{font-family:var(--f-display);font-stretch:85%;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,4.6vw,44px);font-weight:750;line-height:1.05}
h2{font-size:22px;font-weight:700}
h3{font-size:15px;font-weight:650;font-family:var(--f-body);letter-spacing:0}
p{margin:0}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* lock screen */
.gate{min-height:80vh;display:grid;place-items:center}
.gate-card{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:32px 28px;display:grid;gap:18px}
.gate-card h1{font-size:34px}
.gate-card p{color:var(--ink-2)}
.field{display:grid;gap:6px}
.field label{font-size:13px;color:var(--ink-2);font-weight:500}
.pwrow{display:flex;gap:8px}
.pwrow input{flex:1;min-width:0}
.showbtn{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink-2);padding:0 14px;cursor:pointer}
.field input{font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.btn{font:inherit;font-weight:600;border:0;border-radius:8px;padding:11px 16px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.err{color:var(--attn);font-size:14px;min-height:1.2em}
.lockmeta{font-size:13px;color:var(--muted);border-top:1px solid var(--line-soft);padding-top:14px}

/* header */
header.top{display:grid;gap:16px;padding-bottom:22px;border-bottom:2px solid var(--ink)}
.top-row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.top-row > div{min-width:0}
.sub{color:var(--ink-2);margin-top:8px;max-width:62ch}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:13px;font-weight:600;padding:7px 12px;border:0;background:transparent;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.linkbtn{display:inline-flex;gap:8px;align-items:center;font-weight:600;font-size:14px;text-decoration:none;padding:8px 13px;border-radius:8px;background:var(--accent);color:var(--accent-ink)}
.linkbtn svg{width:16px;height:16px}
.fresh{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
.chip b{color:var(--ink);font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:6px;align-content:start}
.kpi .v{font-family:var(--f-display);font-stretch:80%;font-size:32px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .d{font-size:13px;color:var(--ink-2)}
.delta-good{color:var(--good);font-weight:600}
.delta-attn{color:var(--attn);font-weight:600}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* sections */
section{margin-top:44px;display:grid;gap:16px}
.sec-head{display:grid;gap:4px}
.sec-head p{color:var(--ink-2);max-width:70ch}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel h3{margin-bottom:10px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--ink-2);margin-bottom:8px}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:6px}
.sw.line{height:3px;border-radius:2px;vertical-align:3px;width:16px}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;line-height:1.45;padding:8px 10px;border-radius:7px;white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity .12s}
.tip b{font-weight:600}
.callout{border-left:3px solid var(--ext);padding:4px 0 4px 12px;color:var(--ink-2);font-size:14px}
.callout b{color:var(--ink)}

/* tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
td.r,th.r{text-align:right}
td .note{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
tfoot td{font-weight:600;border-top:1px solid var(--line);border-bottom:0}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.bar-row:last-child{border-bottom:0}
.bar-row .lbl{font-size:14px}
.bar-row .lbl small{display:block;color:var(--muted);font-size:12.5px}
.bar-row .val{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:14px;text-align:right}
.bar-track{grid-column:1 / -1;height:8px;border-radius:4px;background:var(--line-soft);overflow:hidden}
.bar-fill{height:100%;border-radius:4px;background:var(--cost)}

/* status */
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.st svg{width:12px;height:12px}
.st.done{color:var(--good);background:var(--good-bg)}
.st.attention{color:var(--attn);background:var(--attn-bg)}
.st.pending{color:var(--pending);background:var(--pending-bg)}
.items{display:grid;gap:0}
.item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid var(--line-soft)}
.item:last-child{border-bottom:0}
.item p{color:var(--ink-2);font-size:14px;margin-top:3px}
.item .meta{font-size:12.5px;color:var(--muted);margin-top:4px}
.bs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.bs{grid-template-columns:minmax(0,1fr)}}
.bs-total{display:flex;justify-content:space-between;font-weight:600;padding-top:10px;border-top:1px solid var(--line);margin-top:4px}
.payroll{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:6px}
.payroll div{background:var(--bg);border-radius:8px;padding:12px}
.payroll .v{font-family:var(--f-display);font-stretch:80%;font-size:24px;font-weight:700}
.payroll .d{font-size:12.5px;color:var(--muted)}
.sources{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.src{display:grid;gap:4px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-decoration:none;color:var(--ink)}
.src:hover{border-color:var(--accent)}
.src span{font-size:13px;color:var(--ink-2)}
footer{margin-top:48px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:grid;gap:6px;max-width:80ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap" id="app">
  <div class="gate" id="gate">
    <form class="gate-card" id="gateForm" autocomplete="off">
      <div class="eyebrow">Arden Colectivo A.C.</div>
      <h1>Sponsor Status</h1>
      <p>Financial status of Arden (UETC, Logrus, EGDC) for Amber and Arden leadership. The figures are encrypted on this page and open with the access password.</p>
      <div class="field">
        <label for="pw">Access password</label>
        <div class="pwrow"><input id="pw" type="password" required autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="word-word-word-word-word"><button type="button" class="showbtn" id="showPw" aria-pressed="false">Show</button></div>
      </div>
      <button class="btn" type="submit" id="unlockBtn">Open dashboard</button>
      <div class="err" id="err" role="alert"></div>
      <div class="lockmeta">Updated on the 1st and 16th of each month from the accountant's files. Last refreshed Oct 8, 2026.</div>
    </form>
  </div>
  <div id="dash" hidden></div>
</div>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pw){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

const form = document.getElementById('gateForm');
document.getElementById('showPw').addEventListener('click', e => {
  const i = document.getElementById('pw'), on = i.type === 'password';
  i.type = on ? 'text' : 'password';
  e.currentTarget.textContent = on ? 'Hide' : 'Show';
  e.currentTarget.setAttribute('aria-pressed', String(on));
});
form.addEventListener('submit', async e => {
  e.preventDefault();
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('err');
  err.textContent = 'Checking…';
  try {
    const data = await decrypt(pw.trim().toLowerCase());
    try { sessionStorage.setItem('ardenPw', pw.trim().toLowerCase()); } catch(_) {}
    err.textContent = '';
    render(data);
  } catch(_) {
    err.textContent = 'That password did not open the dashboard. Check it and try again.';
  }
});
(async () => {
  let saved = null;
  try { saved = sessionStorage.getItem('ardenPw'); } catch(_) {}
  if (saved) { try { render(await decrypt(saved)); } catch(_) {} }
})();

/* ---------- formatting ---------- */
let CUR = 'MXN', FX = 17.3;
try { const c = localStorage.getItem('ardenCur'); if (c === 'USD' || c === 'MXN') CUR = c; } catch(_) {}
const conv = v => CUR === 'USD' ? v / FX : v;
function money(v, opts = {}){
  const x = conv(v), a = Math.abs(x), sign = x < 0 ? '−' : '';
  const sym = '$';
  let s;
  if (opts.full) s = Math.round(a).toLocaleString('en-US');
  else if (a >= 1e6) s = (a/1e6).toFixed(2) + 'M';
  else if (a >= 1e3) s = (a/1e3).toFixed(a >= 1e5 ? 0 : 1) + 'K';
  else s = Math.round(a).toString();
  return sign + sym + s;
}
const pct = v => Math.round(v * 100) + '%';
const sum = a => a.reduce((x, y) => x + y, 0);
const fmtDate = iso => {
  const [y, m, d] = iso.split('-').map(Number);
  const mm = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m-1];
  return d ? `${mm} ${d}, ${y}` : `${mm} ${y}`;
};

const ICON = {
  done:'<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.2 5 8.5l4.5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  attention:'<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 2.2v4.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="6" cy="9.3" r="1" fill="currentColor"/></svg>',
  pending:'<svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6 3.8V6l1.5 1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>'
};
const STLABEL = {done:'Done', attention:'Needs attention', pending:'Pending'};
const status = s => `<span class="st ${s}">${ICON[s]}${STLABEL[s]}</span>`;

let DATA = null;
function render(d){
  DATA = d; FX = d.meta.fxMxnPerUsd;
  document.getElementById('gate').hidden = true;
  const el = document.getElementById('dash');
  el.hidden = false;
  el.innerHTML = view(d);
  wire(d);
}

function view(d){
  const m = d.meta, n = d.months.length;
  const revA = sum(d.revenueAmber), revE = sum(d.revenueExternal), rev = revA + revE;
  const cost = sum(d.operatingCost), dep = sum(d.depreciation), net = sum(d.netResult);
  const opRes = rev - cost;
  const avgCost26 = cost / n, avgCost25 = d.fy2025.cost / 12;
  const costChange = avgCost26 / avgCost25 - 1;
  const cash = d.balance.assets[0].value;
  const extCover = revE / cost;
  const lastI = n - 1;
  const lastCover = d.revenueExternal[lastI] / d.operatingCost[lastI];
  const amberCash = d.customers.find(c => /amber/i.test(c.name)).collected;
  const allCash = sum(d.customers.map(c => c.collected));

  return `
  <header class="top">
    <div class="top-row">
      <div>
        <div class="eyebrow">${esc(m.entity)} · RFC ${esc(m.rfc)}</div>
        <h1>Sponsor Status</h1>
        <p class="sub">How Arden is doing financially, from the accountant's closed books and Arden's own records. Prepared for Amber and Arden leadership by ${esc(m.preparedBy)}.</p>
      </div>
      <div class="tools">
        <div class="seg" role="group" aria-label="Currency">
          <button type="button" data-cur="MXN" aria-pressed="${CUR==='MXN'}">MXN</button>
          <button type="button" data-cur="USD" aria-pressed="${CUR==='USD'}">USD</button>
        </div>
        <a class="linkbtn" href="${esc(m.driveUrl)}" target="_blank" rel="noopener">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h3l1.5 1.5h4.5A1.5 1.5 0 0 1 14 6v5.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
          Source documents on Drive
        </a>
      </div>
    </div>
    <div class="fresh">
      <span class="chip" style="color:var(--good)"><span class="dot"></span><span style="color:var(--ink-2)">Books closed through <b>${fmtDate(m.booksClosedThrough)}</b></span></span>
      <span class="chip">Bank statements through <b>${fmtDate(m.bankStatementsThrough)}</b></span>
      <span class="chip">Payroll through <b>${fmtDate(m.payrollThrough)}</b></span>
      <span class="chip">Last checked <b>${fmtDate(m.lastChecked)}</b> · next <b>${fmtDate(m.nextCheck)}</b></span>
    </div>
  </header>

  <div class="kpis">
    <div class="kpi"><div class="eyebrow">Revenue, Jan–${d.months[lastI]}</div><div class="v">${money(rev)}</div><div class="d">${pct(revA/rev)} Amber · ${pct(revE/rev)} external</div></div>
    <div class="kpi"><div class="eyebrow">Operating result</div><div class="v">${money(opRes)}</div><div class="d">Before ${money(dep)} of equipment depreciation. Net result after depreciation: ${money(net)}</div></div>
    <div class="kpi"><div class="eyebrow">Average monthly cost</div><div class="v">${money(avgCost26)}</div><div class="d"><span class="${costChange<0?'delta-good':'delta-attn'}">${costChange<0?'▼':'▲'} ${pct(Math.abs(costChange))}</span> vs ${money(avgCost25)} in 2025</div></div>
    <div class="kpi"><div class="eyebrow">Cash at ${fmtDate(d.balance.date)}</div><div class="v">${money(cash)}</div><div class="d">Up from ${money(d.fy2025.cashYearEnd)} at Dec 31, 2025</div></div>
  </div>

  <section id="monthly">
    <div class="sec-head"><div class="eyebrow">Monthly performance</div><h2>Revenue against cost, month by month</h2>
      <p>Revenue as recognized by the accountant, split by who paid it. Cost excludes equipment depreciation, which is a non-cash charge.</p></div>
    <div class="panel">
      <div class="legend"><span><i class="sw" style="background:var(--amber)"></i>Amber</span><span><i class="sw" style="background:var(--ext)"></i>External revenue</span><span><i class="sw line" style="background:var(--cost)"></i>Operating cost</span></div>
      <div class="chart" id="chMonthly"></div>
      <div class="tbl-wrap" style="margin-top:12px">
        <table><thead><tr><th>Month</th><th class="r">Amber</th><th class="r">External</th><th class="r">Cost</th><th class="r">Result before depreciation</th><th class="r">Net result</th></tr></thead>
        <tbody>${d.months.map((mo,i)=>`<tr><td>${mo}</td><td class="r num">${money(d.revenueAmber[i],{full:1})}</td><td class="r num">${money(d.revenueExternal[i],{full:1})}</td><td class="r num">${money(d.operatingCost[i],{full:1})}</td><td class="r num">${money(d.revenueAmber[i]+d.revenueExternal[i]-d.operatingCost[i],{full:1})}</td><td class="r num">${money(d.netResult[i],{full:1})}</td></tr>`).join('')}</tbody>
        <tfoot><tr><td>Total</td><td class="r num">${money(revA,{full:1})}</td><td class="r num">${money(revE,{full:1})}</td><td class="r num">${money(cost,{full:1})}</td><td class="r num">${money(opRes,{full:1})}</td><td class="r num">${money(net,{full:1})}</td></tr></tfoot></table>
      </div>
    </div>
  </section>

  <section id="selfsuff">
    <div class="sec-head"><div class="eyebrow">Path to self-sufficiency</div><h2>How much of the cost external revenue covers</h2>
      <p>The goal is for Arden to cover its own cost without Amber. This tracks external revenue as a share of operating cost.</p></div>
    <div class="grid2">
      <div class="panel"><h3>External revenue ÷ operating cost</h3><div class="chart" id="chCover"></div></div>
      <div class="panel" style="display:grid;gap:14px;align-content:start">
        <div class="callout">External revenue covered <b>${pct(extCover)}</b> of cost from January to ${d.months[lastI]}, and <b>${pct(lastCover)}</b> in ${d.months[lastI]}.</div>
        <div>
          <h3>Payroll change</h3>
          <div class="payroll">
            <div><div class="d">${esc(d.payroll.before.label)}</div><div class="v">${money(d.payroll.before.monthlyCost)}</div><div class="d">${d.payroll.before.headcount} employees · per month</div></div>
            <div><div class="d">${esc(d.payroll.after.label)}</div><div class="v">${money(d.payroll.after.monthlyCost)}</div><div class="d">${d.payroll.after.headcount} employee · per month</div></div>
          </div>
          <p style="font-size:12.5px;color:var(--muted);margin-top:8px">${esc(d.payroll.note)}</p>
        </div>
      </div>
    </div>
  </section>

  <section id="funding">
    <div class="sec-head"><div class="eyebrow">Who funds Arden</div><h2>Revenue sources, January to ${d.months[lastI]}</h2>
      <p>Invoiced and collected amounts include VAT where it applies. Amber provided ${pct(amberCash/allCash)} of the cash collected in the period; in 2025 Amber was ${pct(d.fy2025.amberShareOfBilling)} of billing.</p></div>
    <div class="panel tbl-wrap">
      <table><thead><tr><th>Source</th><th>Type</th><th class="r">Invoiced</th><th class="r">Collected</th><th class="r">Outstanding</th></tr></thead>
      <tbody>${d.customers.map(c=>{const o=c.invoiced-c.collected;return `<tr><td><span style="display:inline-flex;align-items:center;gap:8px"><i class="sw" style="background:${/amber/i.test(c.name)?'var(--amber)':'var(--ext)'};margin:0"></i>${esc(c.name)}</span>${c.note?`<span class="note">${esc(c.note)}</span>`:''}</td><td>${esc(c.type)}</td><td class="r num">${money(c.invoiced,{full:1})}</td><td class="r num">${money(c.collected,{full:1})}</td><td class="r num">${o>0?money(o,{full:1}):'—'}</td></tr>`}).join('')}</tbody>
      <tfoot><tr><td colspan="2">Total</td><td class="r num">${money(sum(d.customers.map(c=>c.invoiced)),{full:1})}</td><td class="r num">${money(allCash,{full:1})}</td><td class="r num">${money(sum(d.customers.map(c=>Math.max(0,c.invoiced-c.collected))),{full:1})}</td></tr></tfoot></table>
    </div>
  </section>

  <section id="costs">
    <div class="sec-head"><div class="eyebrow">Where the money goes</div><h2>Operating cost by category, January to ${d.months[lastI]}</h2></div>
    <div class="grid2">
      <div class="panel">${(()=>{const mx=Math.max(...d.costGroups.map(g=>g.value)),tot=sum(d.costGroups.map(g=>g.value));return d.costGroups.map(g=>`<div class="bar-row"><div class="lbl">${esc(g.label)}<small>${esc(g.note)}</small></div><div class="val">${money(g.value)} <span style="color:var(--muted)">· ${pct(g.value/tot)}</span></div><div class="bar-track"><div class="bar-fill" style="width:${(g.value/mx*100).toFixed(1)}%"></div></div></div>`).join('')})()}</div>
      <div class="panel">
        <h3>Against the 2H plan, May to July</h3>
        <div class="tbl-wrap"><table><thead><tr><th>Month</th><th class="r">Plan result</th><th class="r">Actual result</th></tr></thead>
        <tbody>${d.plan2H.months.map((mo,i)=>{const p=d.plan2H.planRevenue[i]-d.plan2H.planCost[i],a=d.plan2H.actualRevenue[i]-d.plan2H.actualCost[i];return `<tr><td>${mo}</td><td class="r num">${money(p)}</td><td class="r num">${money(a)}</td></tr>`}).join('')}</tbody>
        <tfoot><tr><td>Total</td><td class="r num">${money(sum(d.plan2H.planRevenue)-sum(d.plan2H.planCost))}</td><td class="r num">${money(sum(d.plan2H.actualRevenue)-sum(d.plan2H.actualCost))}</td></tr></tfoot></table></div>
        <p style="font-size:12.5px;color:var(--muted);margin-top:10px">${esc(d.plan2H.note)}</p>
      </div>
    </div>
  </section>

  <section id="yoy">
    <div class="sec-head"><div class="eyebrow">Year over year</div><h2>2025 full year against 2026 so far</h2><p>Monthly averages, so a 12-month year compares with a ${n}-month period.</p></div>
    <div class="panel tbl-wrap">
      <table><thead><tr><th>Per month</th><th class="r">2025</th><th class="r">2026 (Jan–${d.months[lastI]})</th><th class="r">Change</th></tr></thead>
      <tbody>
        ${[['Revenue', d.fy2025.revenue/12, rev/n, 1],['Operating cost', d.fy2025.cost/12, cost/n, -1],['Net result', d.fy2025.netResult/12, net/n, 1]].map(([l,a,b,dir])=>{const ch=b-a,good=ch*dir>0;return `<tr><td>${l}</td><td class="r num">${money(a)}</td><td class="r num">${money(b)}</td><td class="r num ${good?'delta-good':'delta-attn'}">${ch>0?'+':''}${money(ch)}</td></tr>`}).join('')}
      </tbody></table>
      <p style="font-size:12.5px;color:var(--muted);margin-top:10px">2025 figures from the FY2025 statements in the folder (net loss ${money(d.fy2025.netResult,{full:1})}). After year-end adjustments the accountant carries a 2025 loss of ${money(d.fy2025.netResultRestated,{full:1})} into 2026; final 2025 figures are pending. 2026 net result includes depreciation; 2025 statements recorded none.</p>
    </div>
  </section>

  <section id="balance">
    <div class="sec-head"><div class="eyebrow">Balance sheet</div><h2>What Arden has and owes at ${fmtDate(d.balance.date)}</h2></div>
    <div class="bs">
      ${[['Assets', d.balance.assets],['Liabilities', d.balance.liabilities]].map(([t,rows])=>`<div class="panel"><h3>${t}</h3>${rows.map(r=>`<div class="bar-row" style="grid-template-columns:minmax(0,1fr) auto"><div class="lbl">${esc(r.label)}<small>${esc(r.note)}</small></div><div class="val">${money(r.value)}</div></div>`).join('')}<div class="bs-total"><span>Total ${t.toLowerCase()}</span><span class="num">${money(sum(rows.map(r=>r.value)),{full:1})}</span></div></div>`).join('')}
    </div>
    <p class="callout" style="border-left-color:var(--attn)">Of the ${money(sum(d.balance.liabilities.map(r=>r.value)))} in liabilities, ${money(d.balance.liabilities[0].value + d.balance.liabilities[4].value)} are legacy balances from before 2025 that are under review with the accountant.</p>
  </section>

  <section id="updates">
    <div class="sec-head"><div class="eyebrow">Since the last close</div><h2>What changed after ${fmtDate(m.booksClosedThrough)}</h2><p>These are not yet in the accountant's statements.</p></div>
    <div class="panel items">${d.updates.map(u=>`<div class="item">${status(u.status)}<div><h3>${esc(u.title)}</h3><p>${esc(u.detail)}</p><div class="meta">${fmtDate(u.date)} · ${esc(u.source)}</div></div></div>`).join('')}</div>
  </section>

  <section id="open">
    <div class="sec-head"><div class="eyebrow">Open items</div><h2>What is still in progress</h2></div>
    <div class="panel items">${d.openItems.map(u=>`<div class="item">${status(u.status)}<div><h3>${esc(u.title)}</h3><p>${esc(u.detail)}</p><div class="meta">Owner: ${esc(u.owner)}</div></div></div>`).join('')}</div>
  </section>

  <section id="sources">
    <div class="sec-head"><div class="eyebrow">Source documents</div><h2>Everything behind these numbers</h2><p>The accountant uploads statements, bank files and payroll to this Google Drive folder. Access requires a Google account that the folder has been shared with.</p></div>
    <div class="sources">
      <a class="src" href="${esc(m.driveUrl)}" target="_blank" rel="noopener" style="border-color:var(--accent)"><b>Arden central folder</b><span>All accounting files</span></a>
      ${d.sources.map(s=>`<a class="src" href="${esc(s.url)}" target="_blank" rel="noopener"><b>${esc(s.label)}</b><span>${esc(s.detail)}</span></a>`).join('')}
    </div>
  </section>

  <footer>
    <p>Figures in Mexican pesos unless USD is selected (${esc(m.fxNote)}). Sources: income statement, balance sheet and trial balance prepared by Arden's accountant (delivered ${fmtDate(m.booksDelivered)}), BBVA bank statements, and payroll registers. "Operating result" is revenue minus operating cost, before depreciation.</p>
    <p>This page refreshes on the 1st and 16th of each month from the Drive folder.</p>
  </footer>`;
}

/* ---------- charts ---------- */
const NS = 'http://www.w3.org/2000/svg';
function niceMax(v){ const p = Math.pow(10, Math.floor(Math.log10(v))); for (const k of [1,1.5,2,2.5,3,4,5,6,8,10]) if (k*p >= v) return k*p; return 10*p; }

function monthlyChart(d){
  const host = document.getElementById('chMonthly');
  const W = 760, H = 300, L = 58, R = 12, T = 14, B = 30;
  const n = d.months.length, iw = W - L - R, ih = H - T - B;
  const tot = d.months.map((_,i)=>d.revenueAmber[i]+d.revenueExternal[i]);
  const mx = niceMax(Math.max(...tot, ...d.operatingCost));
  const y = v => T + ih - (v/mx)*ih;
  const band = iw / n, bw = Math.min(46, band*0.52);
  const cx = i => L + band*i + band/2;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly revenue by source and operating cost">`;
  for (let k=0;k<=4;k++){ const v=mx*k/4, yy=y(v); s+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line-soft)" stroke-width="1"/><text x="${L-8}" y="${yy+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--f-mono)">${money(v)}</text>`; }
  d.months.forEach((mo,i)=>{
    const a=d.revenueAmber[i], e=d.revenueExternal[i], x=cx(i)-bw/2;
    const yE=y(e), hE=ih+T-yE;
    if (e>0) s+=`<path d="${barPath(x, yE, bw, hE, a>0?0:4)}" fill="var(--ext)"/>`;
    if (a>0){ const yA=y(e+a), hA=y(e)-yA-(e>0?2:0); s+=`<path d="${barPath(x, yA, bw, Math.max(hA,1), 4)}" fill="var(--amber)"/>`; }
    s+=`<text x="${cx(i)}" y="${H-8}" text-anchor="middle" font-size="12" fill="var(--ink-2)">${mo}</text>`;
  });
  const pts = d.operatingCost.map((v,i)=>`${cx(i)},${y(v)}`).join(' ');
  s+=`<polyline points="${pts}" fill="none" stroke="var(--cost)" stroke-width="2" stroke-linejoin="round"/>`;
  d.operatingCost.forEach((v,i)=>{ s+=`<circle cx="${cx(i)}" cy="${y(v)}" r="4" fill="var(--cost)" stroke="var(--surface)" stroke-width="2"/>`; });
  d.months.forEach((mo,i)=>{ s+=`<rect class="hit" data-i="${i}" x="${L+band*i}" y="${T}" width="${band}" height="${ih}" fill="transparent"/>`; });
  s+=`<line x1="${L}" x2="${W-R}" y1="${T+ih}" y2="${T+ih}" stroke="var(--line)"/></svg><div class="tip" id="tipM"></div>`;
  host.innerHTML = s;
  const tip = host.querySelector('#tipM'), svg = host.querySelector('svg');
  host.querySelectorAll('.hit').forEach(r=>{
    const show = () => {
      const i=+r.dataset.i, a=d.revenueAmber[i], e=d.revenueExternal[i], c=d.operatingCost[i];
      tip.innerHTML = `<b>${d.months[i]} 2026</b><br>Amber ${money(a)}<br>External ${money(e)}<br>Cost ${money(c)}<br>Result ${money(a+e-c)}`;
      const sc = svg.getBoundingClientRect().width / W;
      tip.style.left = (cx(i)*sc) + 'px';
      tip.style.top = (y(Math.max(a+e,c))*sc - 8) + 'px';
      tip.style.opacity = 1;
    };
    r.addEventListener('mouseenter', show); r.addEventListener('click', show);
    r.addEventListener('mouseleave', ()=> tip.style.opacity = 0);
  });
}
function barPath(x, y, w, h, r){
  r = Math.min(r, h, w/2);
  return `M${x},${y+h} L${x},${y+r} Q${x},${y} ${x+r},${y} L${x+w-r},${y} Q${x+w},${y} ${x+w},${y+r} L${x+w},${y+h} Z`;
}
function coverChart(d){
  const host = document.getElementById('chCover');
  const W = 520, H = 230, L = 40, R = 10, T = 18, B = 28;
  const n = d.months.length, iw = W-L-R, ih = H-T-B;
  const vals = d.months.map((_,i)=> d.revenueExternal[i]/d.operatingCost[i]);
  const mx = 1.2, y = v => T + ih - (Math.min(v,mx)/mx)*ih;
  const band = iw/n, bw = Math.min(34, band*0.5), cx = i => L + band*i + band/2;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="External revenue as a share of operating cost by month">`;
  [0,.5,1].forEach(v=>{ const yy=y(v); s+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="${v===1?'var(--ink-2)':'var(--line-soft)'}" stroke-width="1" ${v===1?'stroke-dasharray="4 4"':''}/><text x="${L-6}" y="${yy+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--f-mono)">${pct(v)}</text>`; });
  s+=`<text x="${L+4}" y="${y(1)-6}" text-anchor="start" font-size="11" fill="var(--ink-2)">Break-even without Amber</text>`;
  vals.forEach((v,i)=>{
    const yy=y(v), h=T+ih-yy;
    if (h>0.5) s+=`<path d="${barPath(cx(i)-bw/2, yy, bw, h, 4)}" fill="var(--ext)"/>`;
    s+=`<text x="${cx(i)}" y="${yy-6}" text-anchor="middle" font-size="11" fill="var(--ink-2)" font-family="var(--f-mono)">${pct(v)}</text>`;
    s+=`<text x="${cx(i)}" y="${H-8}" text-anchor="middle" font-size="12" fill="var(--ink-2)">${d.months[i]}</text>`;
  });
  s+=`<line x1="${L}" x2="${W-R}" y1="${T+ih}" y2="${T+ih}" stroke="var(--line)"/></svg>`;
  host.innerHTML = s;
}

function wire(d){
  monthlyChart(d); coverChart(d);
  document.querySelectorAll('[data-cur]').forEach(b=> b.addEventListener('click', ()=>{
    CUR = b.dataset.cur; try { localStorage.setItem('ardenCur', CUR); } catch(_) {}
    render(DATA);
  }));
}
</script>
